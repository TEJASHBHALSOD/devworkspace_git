{% extends "admin/base.html" %}{% set active_admin_page='courses' %}{% block admin_breadcrumb %}{{ 'Edit Quiz' if quiz else 'Add Quiz' }}{% endblock %}{% block admin_content %}
<div class="ad-heading"><div><h1>{{ 'Edit Quiz' if quiz else 'Add Quiz' }}</h1><p>Lesson: {{ lesson.title }}</p></div><a class="ad-btn ad-outline" href="{{ url_for('admin.lesson_detail',lesson_id=lesson.id) }}">Lesson</a></div>
<div class="ad-card"><div class="ad-body"><form method="POST"><div class="ad-grid2"><div class="ad-field"><label class="ad-label">Title *</label><input class="ad-input" name="title" value="{{ quiz.title if quiz else '' }}" required></div><div class="ad-field"><label class="ad-label">Pass Mark (%)</label><input class="ad-input" type="number" min="0" max="100" name="pass_mark" value="{{ quiz.pass_mark if quiz else 60 }}"></div></div><div class="ad-field"><label class="ad-label">Status</label><select class="ad-select" name="status"><option value="draft" {% if quiz and quiz.status=='draft' %}selected{% endif %}>Draft</option><option value="published" {% if quiz and quiz.status=='published' %}selected{% endif %}>Published</option></select></div><div class="ad-form-actions"><a class="ad-btn ad-outline" href="{{ url_for('admin.lesson_detail',lesson_id=lesson.id) }}">Cancel</a><button class="ad-btn">Save Quiz</button></div></form></div></div>
{% endblock %}
