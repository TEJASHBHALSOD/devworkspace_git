{% extends "admin/base.html" %}{% set active_admin_page='courses' %}{% block admin_breadcrumb %}{{ 'Edit Chapter' if chapter else 'Add Chapter' }}{% endblock %}{% block admin_content %}
<div class="ad-heading"><div><h1>{{ 'Edit Chapter' if chapter else 'Add Chapter' }}</h1><p>Course: {{ course.title }}</p></div><a class="ad-btn ad-outline" href="{{ url_for('admin.course_detail',course_id=course.id) }}">Course</a></div>
<div class="ad-card"><div class="ad-body"><form method="POST"><div class="ad-grid2"><div class="ad-field"><label class="ad-label">Title *</label><input class="ad-input" name="title" value="{{ chapter.title if chapter else '' }}" required></div><div class="ad-field"><label class="ad-label">Order</label><input class="ad-input" type="number" min="1" name="order_no" value="{{ chapter.order_no if chapter else 1 }}"></div></div><div class="ad-field"><label class="ad-label">Description</label><textarea class="ad-textarea" style="min-height:120px" name="description">{{ chapter.description if chapter else '' }}</textarea></div><div class="ad-field"><label class="ad-label">Status</label><select class="ad-select" name="status"><option value="published" {% if not chapter or chapter.status=='published' %}selected{% endif %}>Published</option><option value="draft" {% if chapter and chapter.status=='draft' %}selected{% endif %}>Draft</option></select></div><div class="ad-form-actions"><a class="ad-btn ad-outline" href="{{ url_for('admin.course_detail',course_id=course.id) }}">Cancel</a><button class="ad-btn">Save Chapter</button></div></form></div></div>
{% endblock %}
