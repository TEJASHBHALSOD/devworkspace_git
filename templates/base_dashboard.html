<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevWorkspace - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { min-height: 100vh; overflow-x: hidden; }
        #wrapper { display: flex; width: 100%; }
        #sidebar { min-width: 250px; max-width: 250px; min-height: 100vh; background: #1e1e2d; color: #fff; }
        #sidebar .nav-link { color: #a2a3b7; padding: 12px 20px; }
        #sidebar .nav-link:hover, #sidebar .nav-link.active { color: #fff; background: #1b1b28; }
        #content { width: 100%; background: #f5f8fa; }
    </style>
</head>
<body>
<div id="wrapper">
    <!-- Sidebar -->
    <nav id="sidebar">
        <div class="p-3 border-bottom border-secondary">
            <h4 class="fw-bold mb-0 text-white"><i class="fa-solid fa-code text-primary me-2"></i>DevWorkspace</h4>
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item"><a href="{{ url_for('dashboard.index') }}" class="nav-link active"><i class="fa-solid fa-gauge me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a href="#" class="nav-link"><i class="fa-solid fa-laptop-code me-2"></i>Code Workspace</a></li>
            <li class="nav-item"><a href="#" class="nav-link"><i class="fa-solid fa-folder me-2"></i>My Projects</a></li>
            <li class="nav-item"><a href="#" class="nav-link"><i class="fa-solid fa-graduation-cap me-2"></i>Learning</a></li>
            <li class="nav-item"><a href="{{ url_for('auth.logout') }}" class="nav-link text-danger"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4">
            <span class="navbar-brand fw-bold">User Dashboard</span>
            <div class="ms-auto d-flex align-items-center">
                <span class="me-3 text-muted">Welcome, <strong>{{ current_user.full_name }}</strong></span>
            </div>
        </nav>
        <div class="p-4">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
